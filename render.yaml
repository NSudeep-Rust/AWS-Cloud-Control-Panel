services:
  - type: web
    name: cloudshield
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements-prod.txt"
    startCommand: "uvicorn app.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: WEB_BASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
