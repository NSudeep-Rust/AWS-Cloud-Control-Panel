name: Build Linux .deb (Debian/Ubuntu)

# Trigger manually OR auto on push to relevant files
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (must match VERSION file, e.g. 1.0.2)'
        required: true
        default: '1.0.2'
      upload_release:
        description: 'Upload to existing GitHub Release?'
        required: true
        default: 'true'
        type: string
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'electron/main-linux.js'
      - 'cloudshield-linux.spec'
      - 'requirements-linux.txt'
      - 'backend_entry.py'
      - 'VERSION'

jobs:
  build-linux-deb:
    name: Build Debian Package (AMD64)
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:

      # ── 0. Resolve version (input OR VERSION file) ────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve build version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "upload_release=${{ github.event.inputs.upload_release }}" >> $GITHUB_OUTPUT
          else
            VER=$(cat VERSION | tr -d '[:space:]')
            echo "version=$VER" >> $GITHUB_OUTPUT
            echo "upload_release=true" >> $GITHUB_OUTPUT
          fi
          echo "Resolved version: $(cat VERSION | tr -d '[:space:]')"

      # ── 2. Python 3.11 ───────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies (Linux-compatible) + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-linux.txt
          pip install certifi pyinstaller
          python -c "import certifi; print('certifi OK:', certifi.where())"

      # ── 3. Node.js 18 ────────────────────────────────────────────────────────
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # ── 4. React frontend ────────────────────────────────────────────────────
      - name: Install frontend dependencies
        run: cd app/ui && npm ci

      - name: Build React (Vite production)
        run: cd app/ui && npm run build

      # ── 5. Python backend (Linux ELF binary via PyInstaller) ─────────────────
      - name: Build Python backend with PyInstaller (Linux)
        run: python -m PyInstaller cloudshield-linux.spec --noconfirm

      - name: Verify backend binary
        run: |
          ls -lh dist/cloudshield-backend/cloudshield-backend
          file dist/cloudshield-backend/cloudshield-backend
          echo "Backend binary OK"

      # ── 6. Electron .deb ─────────────────────────────────────────────────────
      - name: Install Linux build tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg

      - name: Install Electron dependencies
        run: cd electron && npm ci

      - name: Patch electron package.json to use Linux entry point
        run: |
          cd electron
          node -e "
            const fs = require('fs');
            const p  = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.main   = 'main-linux.js';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2));
          "

      - name: Build Electron Linux .deb
        run: cd electron && npm run build-linux

      - name: List Electron build output
        run: ls -lh electron/dist/

      # ── 7. Package update zip (backend + VERSION only) ────────────────────────
      - name: Create update zip (for updater compatibility)
        run: |
          cd dist
          zip -r ../cloudshield-update-v${{ steps.ver.outputs.version }}-linux-amd64.zip \
            cloudshield-backend/ \
            ../VERSION
          cd ..
          ls -lh cloudshield-update-v${{ steps.ver.outputs.version }}-linux-amd64.zip

      # ── 8. Rename .deb to release name ────────────────────────────────────────
      - name: Rename .deb to release filename
        run: |
          DEB=$(find electron/dist -name "*.deb" | head -1)
          echo "Found deb: $DEB"
          cp "$DEB" "CloudShield-Setup-v${{ steps.ver.outputs.version }}-linux-amd64.deb"
          ls -lh "CloudShield-Setup-v${{ steps.ver.outputs.version }}-linux-amd64.deb"

      # ── 9. Upload artifacts ───────────────────────────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CloudShield-Linux-${{ steps.ver.outputs.version }}
          path: |
            CloudShield-Setup-v${{ steps.ver.outputs.version }}-linux-amd64.deb
            cloudshield-update-v${{ steps.ver.outputs.version }}-linux-amd64.zip
          retention-days: 30

      # ── 10. Upload to GitHub Release ─────────────────────────────────────────
      - name: Upload to GitHub Release
        if: ${{ steps.ver.outputs.upload_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: CloudShield v${{ steps.ver.outputs.version }}
          body: |
            ## CloudShield v${{ steps.ver.outputs.version }}

            ### What's new in v${{ steps.ver.outputs.version }}
            - **Scanner fixed**: Findings now save correctly (composite PK + account_id type fixes)
            - **Stale findings resolved**: Previous open findings correctly resolved on rescan
            - **Performance**: Worker pool tuned for t3.micro (8 outer / 4 inner threads)
            - **Desktop fix**: App now opens directly to panel (no more landing page redirect)

            ### Linux (Debian / Ubuntu)
            **Install:**
            ```bash
            sudo dpkg -i CloudShield-Setup-v${{ steps.ver.outputs.version }}-linux-amd64.deb
            sudo apt-get install -f   # resolve any missing dependencies
            cloudshield               # launch
            ```
            **Uninstall:**
            ```bash
            sudo apt-get remove cloudshield
            ```
          files: |
            CloudShield-Setup-v${{ steps.ver.outputs.version }}-linux-amd64.deb
            cloudshield-update-v${{ steps.ver.outputs.version }}-linux-amd64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
