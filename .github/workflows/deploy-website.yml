name: 🚀 Deploy to CloudShield.me

on:
  push:
    branches:
      - main
    paths:
      - 'app/ui/src/**'
      - 'app/ui/public/**'
      - 'app/ui/index.html'
      - 'app/ui/vite.config.*'
      - 'app/ui/package.json'
      - 'app/api/**'
      - 'app/modules/**'
      - 'app/config/**'
      - 'app/core/**'
      - 'app/database/**'
      - 'docs/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to EC2
    runs-on: ubuntu-latest

    steps:

      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: 📥 Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Build React frontend ──────────────────────────────────────────────
      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/ui/package-lock.json

      - name: 📦 Install frontend dependencies
        run: cd app/ui && npm ci

      - name: 🔨 Build React (production)
        run: cd app/ui && npm run build
        env:
          VITE_API_URL: https://cloudshield.me
          VITE_WEB_MODE: true

      # ── 3. Package into tar (in workspace, NOT /tmp) ─────────────────────────
      - name: 📦 Package files for deployment
        run: |
          tar -czf cloudshield-deploy.tar.gz \
            app/ui/dist \
            app/api \
            app/modules \
            app/config \
            app/core \
            app/database \
            docs
          echo "Package size: $(du -sh cloudshield-deploy.tar.gz)"

      # ── 4. Upload via appleboy/scp-action (handles MOTD/banner correctly) ────
      - name: 📤 Upload to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: root
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "cloudshield-deploy.tar.gz"
          target: "/tmp/"

      # ── 5. Extract + apply + restart via appleboy/ssh-action ─────────────────
      - name: 🔄 Apply changes & restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: root
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "📦 Extracting deployment package..."
            cd /tmp
            tar -xzf cloudshield-deploy.tar.gz
            rm cloudshield-deploy.tar.gz

            echo "📁 Deploying frontend..."
            cp -rf /tmp/app/ui/dist/* /root/cloudshield/app/ui/dist/
            echo "✅ Frontend deployed"

            echo "📁 Deploying backend..."
            cp -rf /tmp/app/api       /root/cloudshield/app/
            cp -rf /tmp/app/modules   /root/cloudshield/app/
            cp -rf /tmp/app/config    /root/cloudshield/app/
            cp -rf /tmp/app/core      /root/cloudshield/app/
            cp -rf /tmp/app/database  /root/cloudshield/app/
            cp -rf /tmp/docs          /root/cloudshield/
            echo "✅ Backend deployed"

            echo "🧹 Cleaning up..."
            rm -rf /tmp/app /tmp/docs

            echo "🔄 Restarting CloudShield service..."
            systemctl restart cloudshield
            sleep 5

            systemctl is-active cloudshield \
              && echo "🎉 CloudShield.me is live!" \
              || (echo "❌ Service failed!" && journalctl -u cloudshield -n 20 --no-pager && exit 1)

      - name: ✅ Done
        run: echo "🚀 CloudShield.me deployed successfully!"
