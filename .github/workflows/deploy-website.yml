name: 🚀 Deploy to CloudShield.me

# Triggers on push to main (only when app code changes)
# Also can be triggered manually from GitHub Actions tab
on:
  push:
    branches:
      - main
    paths:
      - 'app/ui/src/**'
      - 'app/ui/index.html'
      - 'app/ui/vite.config.*'
      - 'app/ui/package.json'
      - 'app/api/**'
      - 'app/modules/**'
      - 'app/config/**'
      - 'app/core/**'
      - 'app/database/**'
  workflow_dispatch:   # manual trigger from GitHub UI

jobs:
  deploy:
    name: Build & Deploy to EC2
    runs-on: ubuntu-22.04

    steps:

      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: 📥 Checkout source
        uses: actions/checkout@v4

      # ── 2. Build React frontend ──────────────────────────────────────────────
      - name: 🟢 Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: app/ui/package-lock.json

      - name: 📦 Install frontend dependencies
        run: cd app/ui && npm ci

      - name: 🔨 Build React (production — cloudshield.me)
        run: cd app/ui && npm run build
        env:
          VITE_API_URL: https://cloudshield.me
          VITE_WEB_MODE: true

      # ── 3. Upload frontend dist/ to EC2 ─────────────────────────────────────
      - name: 📤 Upload frontend dist to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "app/ui/dist/"
          target: "/tmp/cs-deploy/"

      # ── 4. Upload backend app/ to EC2 ───────────────────────────────────────
      - name: 📤 Upload backend to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "app/api/,app/modules/,app/config/,app/core/,app/database/"
          target: "/tmp/cs-backend/"

      # ── 5. Apply changes + restart service on EC2 ───────────────────────────
      - name: 🔄 Apply & restart on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "📁 Deploying frontend..."
            sudo cp -rf /tmp/cs-deploy/app/ui/dist/* /root/cloudshield/app/ui/dist/
            echo "✅ Frontend deployed"

            echo "📁 Deploying backend..."
            sudo cp -rf /tmp/cs-backend/app/api       /root/cloudshield/app/
            sudo cp -rf /tmp/cs-backend/app/modules   /root/cloudshield/app/
            sudo cp -rf /tmp/cs-backend/app/config    /root/cloudshield/app/
            sudo cp -rf /tmp/cs-backend/app/core      /root/cloudshield/app/
            sudo cp -rf /tmp/cs-backend/app/database  /root/cloudshield/app/
            echo "✅ Backend deployed"

            echo "🧹 Cleaning up temp files..."
            rm -rf /tmp/cs-deploy /tmp/cs-backend

            echo "🔄 Restarting CloudShield service..."
            sudo systemctl restart cloudshield
            sleep 5

            # Verify service is running — fails the action if crashed
            sudo systemctl is-active cloudshield \
              && echo "🎉 CloudShield.me is live!" \
              || (echo "❌ Service failed to start!" && sudo journalctl -u cloudshield -n 30 && exit 1)
