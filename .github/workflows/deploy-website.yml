name: 🚀 Deploy to CloudShield.me

on:
  push:
    branches:
      - main
    paths:
      - 'app/ui/src/**'
      - 'app/ui/index.html'
      - 'app/ui/vite.config.*'
      - 'app/ui/package.json'
      - 'app/api/**'
      - 'app/modules/**'
      - 'app/config/**'
      - 'app/core/**'
      - 'app/database/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to EC2
    runs-on: ubuntu-22.04

    steps:

      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: 📥 Checkout source
        uses: actions/checkout@v4

      # ── 2. Setup SSH key ────────────────────────────────────────────────────
      - name: 🔑 Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key.pem
          chmod 600 ~/.ssh/deploy_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # ── 3. Build React frontend ──────────────────────────────────────────────
      - name: 🟢 Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: app/ui/package-lock.json

      - name: 📦 Install frontend dependencies
        run: cd app/ui && npm ci

      - name: 🔨 Build React (production)
        run: cd app/ui && npm run build
        env:
          VITE_API_URL: https://cloudshield.me
          VITE_WEB_MODE: true

      # ── 4. Pre-create temp dirs on EC2 ──────────────────────────────────────
      - name: 📁 Create temp dirs on EC2
        run: |
          ssh -i ~/.ssh/deploy_key.pem -o StrictHostKeyChecking=no \
            ubuntu@${{ secrets.EC2_HOST }} \
            'rm -rf /tmp/cs-dist /tmp/cs-backend && mkdir -p /tmp/cs-dist /tmp/cs-backend'

      # ── 5. Upload frontend dist via SCP ─────────────────────────────────────
      - name: 📤 Upload frontend dist to EC2
        run: |
          scp -i ~/.ssh/deploy_key.pem -o StrictHostKeyChecking=no -r \
            app/ui/dist/. \
            ubuntu@${{ secrets.EC2_HOST }}:/tmp/cs-dist/

      # ── 6. Upload backend via SCP ────────────────────────────────────────────
      - name: 📤 Upload backend to EC2
        run: |
          scp -i ~/.ssh/deploy_key.pem -o StrictHostKeyChecking=no -r \
            app/api/. app/modules/. app/config/. app/core/. app/database/. \
            ubuntu@${{ secrets.EC2_HOST }}:/tmp/cs-backend/

      # ── 7. Apply + restart on EC2 ────────────────────────────────────────────
      - name: 🔄 Apply changes & restart service
        run: |
          ssh -i ~/.ssh/deploy_key.pem -o StrictHostKeyChecking=no \
            ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            set -e

            echo "📁 Deploying frontend..."
            sudo cp -rf /tmp/cs-dist/* /root/cloudshield/app/ui/dist/
            rm -rf /tmp/cs-dist
            echo "✅ Frontend deployed"

            echo "📁 Deploying backend..."
            sudo cp -rf /tmp/cs-backend/api       /root/cloudshield/app/
            sudo cp -rf /tmp/cs-backend/modules   /root/cloudshield/app/
            sudo cp -rf /tmp/cs-backend/config    /root/cloudshield/app/
            sudo cp -rf /tmp/cs-backend/core      /root/cloudshield/app/
            sudo cp -rf /tmp/cs-backend/database  /root/cloudshield/app/
            rm -rf /tmp/cs-backend
            echo "✅ Backend deployed"

            echo "🔄 Restarting CloudShield service..."
            sudo systemctl restart cloudshield
            sleep 5

            sudo systemctl is-active cloudshield \
              && echo "🎉 CloudShield.me is live!" \
              || (echo "❌ Service failed!" && sudo journalctl -u cloudshield -n 20 --no-pager && exit 1)
          EOF

      - name: ✅ Done
        run: echo "🚀 CloudShield.me deployed successfully!"
