name: 🚀 Deploy to CloudShield.me

on:
  push:
    branches:
      - main
    paths:
      - 'app/ui/src/**'
      - 'app/ui/public/**'
      - 'app/ui/index.html'
      - 'app/ui/vite.config.*'
      - 'app/ui/package.json'
      - 'app/api/**'
      - 'app/modules/**'
      - 'app/config/**'
      - 'app/core/**'
      - 'app/database/**'
      - 'docs/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to EC2
    runs-on: ubuntu-latest

    steps:

      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: 📥 Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 2. Setup SSH ─────────────────────────────────────────────────────────
      - name: 🔑 Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key.pem
          chmod 600 ~/.ssh/deploy_key.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # ── 3. Build React frontend ──────────────────────────────────────────────
      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/ui/package-lock.json

      - name: 📦 Install frontend dependencies
        run: cd app/ui && npm ci

      - name: 🔨 Build React (production)
        run: cd app/ui && npm run build
        env:
          VITE_API_URL: https://cloudshield.me
          VITE_WEB_MODE: true

      # ── 4. Package into tar ──────────────────────────────────────────────────
      - name: 📦 Package files for deployment
        run: |
          tar -czf cloudshield-deploy.tar.gz \
            app/ui/dist \
            app/api \
            app/modules \
            app/config \
            app/core \
            app/database \
            docs
          echo "Package size: $(du -sh cloudshield-deploy.tar.gz)"

      # ── 5. Upload via SSH stdin pipe (ubuntu user — avoids SCP MOTD issue) ───
      - name: 📤 Upload to EC2
        run: |
          ssh -i ~/.ssh/deploy_key.pem \
            -o StrictHostKeyChecking=no \
            -o LogLevel=ERROR \
            -o ConnectTimeout=30 \
            ubuntu@${{ secrets.EC2_HOST }} \
            'cat > /tmp/cloudshield-deploy.tar.gz' \
            < cloudshield-deploy.tar.gz
          echo "✅ Upload complete"

      # ── 6. Extract + apply + restart on EC2 ─────────────────────────────────
      - name: 🔄 Apply changes & restart service
        run: |
          ssh -i ~/.ssh/deploy_key.pem \
            -o StrictHostKeyChecking=no \
            -o LogLevel=ERROR \
            -o ConnectTimeout=30 \
            ubuntu@${{ secrets.EC2_HOST }} 'bash -s' << 'SCRIPT'
          set -e

          echo "📦 Extracting deployment package..."
          cd /tmp
          tar -xzf cloudshield-deploy.tar.gz
          rm cloudshield-deploy.tar.gz

          echo "📁 Deploying frontend..."
          sudo cp -rf /tmp/app/ui/dist/* /root/cloudshield/app/ui/dist/
          echo "✅ Frontend deployed"

          echo "📁 Deploying backend..."
          sudo cp -rf /tmp/app/api       /root/cloudshield/app/
          sudo cp -rf /tmp/app/modules   /root/cloudshield/app/
          sudo cp -rf /tmp/app/config    /root/cloudshield/app/
          sudo cp -rf /tmp/app/core      /root/cloudshield/app/
          sudo cp -rf /tmp/app/database  /root/cloudshield/app/
          sudo cp -rf /tmp/docs          /root/cloudshield/
          echo "✅ Backend deployed"

          echo "🧹 Cleaning up..."
          sudo rm -rf /tmp/app /tmp/docs

          echo "🔄 Restarting CloudShield service..."
          sudo systemctl restart cloudshield
          sleep 5

          sudo systemctl is-active cloudshield \
            && echo "🎉 CloudShield.me is live!" \
            || (echo "❌ Service failed!" && sudo journalctl -u cloudshield -n 20 --no-pager && exit 1)
          SCRIPT

      # ── 7. Fix Nginx: /landing → / (fixes GSC "Page with redirect") ─────────
      - name: 🔧 Fix Nginx SEO redirect (/landing → /)
        run: |
          ssh -i ~/.ssh/deploy_key.pem \
            -o StrictHostKeyChecking=no \
            -o LogLevel=ERROR \
            -o ConnectTimeout=30 \
            ubuntu@${{ secrets.EC2_HOST }} 'bash -s' << 'NGINX_SCRIPT'
          set -e
          NGINX_CONF="/etc/nginx/sites-enabled/cloudshield"

          echo "📋 Checking Nginx config..."

          # Use Python to safely inject /landing redirect if not already present
          sudo python3 << 'PYEOF'
import sys

conf_path = "/etc/nginx/sites-enabled/cloudshield"
with open(conf_path, "r") as f:
    config = f.read()

REDIRECT_BLOCK = """
    # SEO fix: redirect /landing → / to prevent GSC "Page with redirect"
    # Canonical URL is https://cloudshield.me (root), not /landing
    location = /landing {
        return 301 https://cloudshield.me;
    }

    # Do not index /panel (React app behind auth - causes redirect in GSC)
    location = /panel {
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
"""

if "location = /landing" in config:
    print("✅ /landing redirect already exists — no changes needed")
    sys.exit(0)

# Find the last closing brace and insert before it
last_brace = config.rfind("}")
if last_brace == -1:
    print("❌ Could not find closing brace in Nginx config!")
    sys.exit(1)

new_config = config[:last_brace] + REDIRECT_BLOCK + "\n" + config[last_brace:]

with open(conf_path, "w") as f:
    f.write(new_config)

print("✅ Injected /landing → / redirect into Nginx config")
PYEOF

          echo "🔍 Testing Nginx config validity..."
          sudo nginx -t

          echo "🔄 Reloading Nginx..."
          sudo systemctl reload nginx

          echo "✅ Nginx SEO fix applied!"
          NGINX_SCRIPT

      - name: ✅ Done
        run: echo "🚀 CloudShield.me deployed + SEO redirect fixed!"

